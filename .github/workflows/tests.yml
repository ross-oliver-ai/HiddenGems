# Runs on every pull request and on main. Shows a green tick or a red cross on the PR.
# Uses a throwaway Postgres that exists only for the run; it never touches the real database or any secret.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/hg_test
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit and database tests (billing rules, report maths, migrations)
        run: npm test

      - name: Install browser for the end-to-end check
        run: npx playwright install --with-deps chromium
      - name: Build the app
        run: npx next build
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/hg_test
          AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-1234
      - name: Start the app
        run: |
          nohup npx next start -p 3100 > app.log 2>&1 &
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/hg_test
          AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-1234
          BILLING_ENABLED: "true"
          STRIPE_SECRET_KEY: sk_test_ci_only
          STRIPE_WEBHOOK_SECRET: whsec_ci_only
          E2E_BOOM: "1"
          RESEND_API_KEY: test
          EMAIL_FROM: test@example.com
      - name: Core journey in a real browser (add, list, sell, reports, lock)
        run: npm run test:e2e
      - name: Show the app log if something failed
        if: failure()
        run: tail -n 80 app.log || true
